<!DOCTYPE html>

    <h2 class="section-title">Katalog Kacamata</h2>

    <div class="category-filter">
        <button class="filter-btn active" data-category="semua">Semua Produk</button>
        <button class="filter-btn" data-category="hitam">Kacamata Hitam</button>
        <button class="filter-btn" data-category="fashion">Fashion</button>
        <button class="filter-btn" data-category="minus">Kacamata Minus</button>
        <button class="filter-btn" data-category="premium">Premium</button>

    <div class="search-box">

        placeholder="Cari produk kacamata...">
